<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 504" role="img" aria-labelledby="title desc">
  <title id="title">おかぽブレイン</title>
  <desc id="desc">暗い宇宙に浮かぶ思考ノードと4本の座標軸</desc>
  <defs>
    <radialGradient id="bg" cx="54%" cy="48%" r="72%">
      <stop offset="0" stop-color="#14284b"/>
      <stop offset=".42" stop-color="#071225"/>
      <stop offset="1" stop-color="#02050b"/>
    </radialGradient>
    <radialGradient id="cyan">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".2" stop-color="#bcecff"/>
      <stop offset=".55" stop-color="#579bff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#579bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet">
