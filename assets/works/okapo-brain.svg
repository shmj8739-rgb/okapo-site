      <circle cx="9" cy="12" r="1" fill="#a8c9ff" opacity=".5"/><circle cx="56" cy="39" r=".8" fill="#fff" opacity=".35"/>
    </pattern>
  </defs>
  <rect width="896" height="504" fill="url(#bg)"/>
  <rect width="896" height="504" fill="url(#stars)"/>
  <g transform="translate(448 250)" stroke-linecap="round">
