# ===================================================
# Netlify 設定ファイル
# ---------------------------------------------------
# このサイトはビルド不要の静的サイト（HTML/CSS/JSをそのまま公開）。
# publish はリポジトリのルートのまま変更しない。
# Stripeのテスト決済（Checkout）用に、サーバー側で秘密鍵を扱う
# Netlify Functions のみを追加する（netlify/functions/ 配下）。
# ===================================================

[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  # Netlify Functions内でネイティブfetch（Stripe REST API呼び出しに使用）を
  # 確実に使うため、Node.jsのバージョンを明示的に固定する。
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
