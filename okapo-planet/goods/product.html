<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>商品詳細 | おかぽるPLANTS GOODS</title>
<meta name="description" content="おかぽるPLANTS GOODSの商品詳細ページです。">
<meta name="robots" content="noindex,follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300..600&family=Noto+Sans+JP:wght@300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/planet.css">
</head>

<body>

<div class="noise-overlay" aria-hidden="true"></div>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">
    <a href="../../index.html" class="brand" style="text-decoration:none;">おかぽる<span class="brand-dot">LAB</span></a>
    <div class="header-meta">
      <span>OKAPO PLANTS</span>
      <span class="meta-divider">/</span>
      <span>GOODS</span>
    </div>
  </div>
</header>

<main class="planet-page">

  <nav class="planet-breadcrumb planet-inner">
    <a href="../../index.html">おかぽるLAB</a>
    <span aria-hidden="true">/</span>
    <a href="../index.html">おかぽるPLANTS</a>
    <span aria-hidden="true">/</span>
    <a href="index.html">GOODS</a>
    <span aria-hidden="true">/</span>
    <span aria-current="page" id="planet-breadcrumb-current">商品詳細</span>
  </nav>

  <div class="planet-inner planet-detail-wrap">

    <p class="planet-not-found" id="planet-not-found">
      指定された商品が見つかりませんでした。<a href="index.html" style="color:var(--planet-green-light);">GOODS一覧に戻る →</a>
    </p>

    <div class="planet-detail" id="planet-detail">
      <div class="planet-detail-media-col">
        <div class="planet-detail-media">
          <span class="planet-detail-icon" aria-hidden="true"></span>
        </div>
        <!-- サムネイル一覧。js/planet-detail.js が product.thumbnails を
             元に描画する（クリックでメイン画像が切り替わる）。
             画像未設定の間は空のまま（CSSで非表示）。 -->
        <div class="planet-detail-thumbs" id="planet-detail-thumbs"></div>
      </div>

      <div class="planet-detail-info">
        <div class="planet-detail-tags"></div>
        <p class="planet-detail-en"></p>
        <h1 class="planet-detail-name"></h1>
        <p class="planet-detail-price"></p>
        <p class="planet-detail-desc"></p>

        <!-- スペック欄。GOODSはサイズを使わないため .planet-detail-size は
             非表示のプレースホルダー。在庫（stockLabel）は
             js/planet-detail.js がこの中に行を追加する。 -->
        <div class="planet-detail-specs">
          <span class="planet-detail-size" hidden></span>
        </div>

        <!-- care（育て方ガイド）はGOODSでは使わない。
             js/planet-detail.js が product.care 不在を検知して自動で非表示にする
             （要素自体は削除しないこと。スクリプトが参照するため）。 -->
        <div class="planet-detail-care">
          <p class="planet-detail-care-title">🌱 育て方ガイド</p>
          <div class="care-row"><span>置き場所</span><strong class="care-light"></strong></div>
          <div class="care-row"><span>水やり</span><strong class="care-water"></strong></div>
          <div class="care-row"><span>難易度</span><strong class="care-level"></strong></div>
        </div>

        <!-- 配送について（product.shipping）・ご注意（product.caution）は
             js/planet-detail.js がこの位置の後ろに自動挿入する。 -->

        <button type="button" class="planet-cart-btn" id="planet-cart-btn">
          購入する
          <span aria-hidden="true">→</span>
        </button>
        <p class="planet-cart-note">※ 購入手続きは、提携先の販売ページで行います。</p>
      </div>
    </div>

    <section class="planet-related">
      <h2 class="planet-related-title">この商品と合わせて見られています</h2>
      <div class="planet-product-grid" id="planet-related-list"></div>
    </section>

  </div>

</main>

<!-- ===== FOOTER ===== -->
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-top">
      <div class="footer-brand">PLANTS<span class="brand-dot">.</span></div>
      <p class="footer-tagline">GOODS｜雑貨 — by おかぽるPLANTS</p>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2026 OKAPO. All rights reserved.</span>
      <a href="../index.html" style="color:var(--grey);text-decoration:none;">おかぽるPLANTSトップへ</a>
      <a href="../green/legal.html" style="color:var(--grey);text-decoration:none;">特定商取引法に基づく表記</a>
      <a href="index.html" style="color:var(--grey);text-decoration:none;">GOODS一覧へ戻る →</a>
    </div>
  </div>
</footer>

<script src="../../js/script.js"></script>
<script type="module" src="../../js/planet-detail.js"></script>
</body>
</html>
