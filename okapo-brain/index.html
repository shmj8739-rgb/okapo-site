<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#02050b" />
  <meta name="description" content="岡ぽの頭の中を旅行する、4軸と10個の思考の星の3D宇宙" />
  <link rel="canonical" href="https://okapo-site.netlify.app/okapo-brain/" />
  <title>おかぽブレイン</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2302050b'/%3E%3Ccircle cx='20' cy='23' r='6' fill='%2300f5ff'/%3E%3Ccircle cx='44' cy='20' r='5' fill='%23ff39d1'/%3E%3Ccircle cx='38' cy='44' r='7' fill='%237c5cff'/%3E%3Cpath d='M25 24l14-3M23 28l11 12m8-15l-3 12' stroke='%23c4fbff' stroke-width='2'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="scene" aria-label="おかぽブレイン。ドラッグで回転、ホイールでズーム、右ドラッグで平行移動"></div>
  <p id="loadStatus" role="status">脳内宇宙に接続しています…</p>
  <div class="noise"></div>

  <header class="topbar">
    <a class="brand" href="#" aria-label="ニューラルマップを初期表示に戻す">
      <span class="brand-mark"><i></i><i></i><i></i></span>
      <span><strong>おかぽブレイン</strong><small>NEURAL UNIVERSE // 02</small></span>
    </a>
    <div class="header-actions">
      <a class="lab-back" href="../index.html">← おかぽるLAB</a>
      <div class="mode-switch" role="group" aria-label="探索モード"><button id="freeMode" aria-pressed="true">FREE EXPLORE</button><button id="tourMode" aria-pressed="false">TOUR MODE</button></div>
    </div>
  </header>

  <main class="overlay">
    <section class="intro" aria-label="表示操作">
      <button id="homeView">中心へ戻る</button><button id="rotateToggle" aria-pressed="false">自動回転 OFF</button>
      <div class="axis-key"><span>論理 ← X → 直感</span><span>静 ← Y → 熱</span><span>過去 ← Z → 未来</span><span>具体 ← W → 抽象</span></div>
    </section>


    <nav id="categories" class="category-bar" aria-label="カテゴリフィルター"></nav>
    <nav id="nodeList" aria-label="思考の星を選択"></nav>
    <section id="tourBar" hidden aria-label="ツアー操作">
      <p id="tourNarration" aria-live="polite"></p>
      <div class="tour-buttons"><button id="prevStop">← PREV</button><output id="tourCount">00 / 10</output><button id="nextStop">NEXT →</button><button id="pauseTour" aria-pressed="false">PAUSE</button><button id="exitTour">EXIT TOUR</button></div>
      <small id="tourStatus" role="status"></small>
    </section>
    <aside class="detail-panel hidden" aria-live="polite" aria-label="選択した思考の詳細" inert>
      <div class="panel-top"><span>NODE INSPECTOR</span><button id="closePanel" aria-label="詳細を閉じる">×</button></div>
      <div class="node-index">NODE <b id="nodeIndex">01</b> / <span id="nodeTotal"></span> · 仮データ</div>
      <div class="detail-icon" id="detailIcon"><span></span></div>
      <p class="detail-category" id="detailCategory"></p>
      <h2 id="detailTitle"></h2>
      <p class="detail-description" id="detailDescription"></p>
      <div id="keywords"></div><dl id="axisValues"></dl><h3 class="related-heading">関連する思考</h3><div id="relatedNodes"></div>
      <p class="detail-note">座標と説明は編集可能な仮設定です。</p>
    </aside>
  </main>

  <footer>

    <span class="signal-bars"><i></i><i></i><i></i><i></i><i></i></span>
    <span>MEMORY STREAM <b>STABLE</b></span>
  </footer>

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/"}}</script>
  <script type="module">import('./app.js').catch(error=>{document.getElementById('loadStatus').textContent='3D空間を読み込めませんでした。通信環境とWebGL対応を確認し、再読み込みしてください。';console.error(error);});</script>
</body>
</html>
