    <circle cx="-138" cy="93" r="42" fill="url(#cyan)"/>
    <circle cx="120" cy="-95" r="49" fill="url(#violet)"/>
    <circle cx="155" cy="60" r="44" fill="url(#violet)"/>
    <circle cx="85" cy="126" r="38" fill="url(#cyan)"/>
