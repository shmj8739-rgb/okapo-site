    <path d="M-135-135L135 135" stroke="#c9aaff" stroke-opacity=".75" stroke-width="2" stroke-dasharray="9 10"/>
    <g stroke="#91baff" stroke-opacity=".32">
      <path d="M0 0L-150-76M0 0L-138 93M0 0L120-95M0 0L155 60M0 0L85 126"/>
