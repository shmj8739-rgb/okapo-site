<!DOCTYPE html>
<html lang="ja">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZKJT7MEQVL"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>投稿詳細 | おかぽ広場</title>
<meta name="description" content="おかぽ広場の投稿詳細ページ。">
<meta name="robots" content="noindex,follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Inter:wght@300..600&family=Noto+Sans+JP:wght@300..600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/hiroba.css">
</head>

<body>

<div class="noise-overlay" aria-hidden="true"></div>

<!-- ===== HEADER ===== -->
<header class="site-header">
  <div class="header-inner">
    <a href="../index.html" class="brand" style="text-decoration:none;">おかぽる<span class="brand-dot">LAB</span></a>
    <div class="header-meta">
      <span>OKAPO HIROBA</span>
      <span class="meta-divider">/</span>
      <span>COMMUNITY</span>
    </div>
  </div>
</header>

<main class="hiroba-page">
  <div class="hiroba-inner">

    <nav class="hiroba-breadcrumb">
      <a href="../index.html">おかぽるLAB</a>
      <span>/</span>
      <a href="index.html">おかぽ広場</a>
      <span>/</span>
      <span>投稿詳細</span>
    </nav>

    <div id="hiroba-loading-state" class="hiroba-loading-state">読み込み中…</div>
    <div id="hiroba-error-state" class="hiroba-error-state" style="display:none;"></div>

    <article id="hiroba-post-detail" style="display:none;">

      <div class="hiroba-detail-header">
        <h1 class="hiroba-detail-title" id="detail-title"></h1>
        <div class="hiroba-detail-meta">
          <span><strong id="detail-name"></strong></span>
          <span id="detail-date"></span>
          <span><span id="detail-views"></span> 閲覧</span>
        </div>
      </div>

      <div class="hiroba-detail-image" id="detail-image-wrap" style="display:none;">
        <img id="detail-image" src="" alt="投稿画像">
      </div>

      <p class="hiroba-detail-body" id="detail-body"></p>

      <div class="hiroba-detail-actions">
        <a href="index.html" class="hiroba-btn">← 一覧へ戻る</a>
        <button type="button" id="hiroba-delete-open-btn" class="hiroba-btn hiroba-btn-danger">削除する</button>
      </div>

      <section class="hiroba-comment-section">
        <h2>コメント</h2>

        <div id="hiroba-comment-list" class="hiroba-comment-list"></div>
        <p id="hiroba-comment-empty" class="hiroba-comment-empty" style="display:none;">まだコメントはありません。</p>

        <form id="hiroba-comment-form" class="hiroba-form" novalidate>
          <div class="hiroba-honeypot" aria-hidden="true">
            <label for="comment-field-website">Website</label>
            <input type="text" id="comment-field-website" name="website" tabindex="-1" autocomplete="off">
          </div>

          <div class="hiroba-field">
            <label for="comment-field-name">名前</label>
            <input type="text" id="comment-field-name" maxlength="30" placeholder="未入力の場合は「名無しさん」になります" autocomplete="off">
          </div>

          <div class="hiroba-field">
            <label for="comment-field-body">コメント <span aria-hidden="true">*</span></label>
            <textarea id="comment-field-body" maxlength="500" required style="min-height:100px;"></textarea>
          </div>

          <div id="hiroba-comment-message" class="hiroba-form-message"></div>

          <div class="hiroba-form-actions">
            <button type="submit" id="hiroba-comment-submit" class="hiroba-btn hiroba-btn-primary">コメントする</button>
          </div>
        </form>
      </section>

    </article>

  </div>
</main>

<!-- ===== 削除確認モーダル ===== -->
<div id="hiroba-delete-modal" class="hiroba-modal-overlay">
  <div class="hiroba-modal">
    <p>この投稿を削除しますか？<br>この操作は取り消せません。</p>

    <div class="hiroba-field">
      <label for="delete-key-input">削除キー</label>
      <input type="password" id="delete-key-input" autocomplete="off">
    </div>

    <div id="hiroba-delete-message" class="hiroba-form-message"></div>

    <div class="hiroba-modal-actions">
      <button type="button" id="hiroba-delete-cancel-btn" class="hiroba-btn">キャンセル</button>
      <button type="button" id="hiroba-delete-confirm-btn" class="hiroba-btn hiroba-btn-danger">削除する</button>
    </div>
  </div>
</div>

<!-- ===== FOOTER ===== -->
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-top">
      <div class="footer-brand">OKAPO<span class="brand-dot">.</span></div>
      <p class="footer-tagline">Shape the unseen future.</p>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2026 OKAPO. All rights reserved.</span>
    </div>
  </div>
</footer>

<script type="module" src="../js/hiroba-post.js"></script>
</body>
</html>
